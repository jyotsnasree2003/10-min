    depends_on:
      inventory-db:
        condition: service_healthy
    env_file:
      - ./inventory_services/.env

    ports:
      - "8005:8005"

  inventory-db:
    image: postgres:16
    container_name: inventory-db
    restart: always

    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5436:5432"

    volumes:
      - inventory_db_data:/var/lib/postgresql/data

