    depends_on:
      cart-db:
        condition: service_healthy
    env_file:
      - ./cart_service/.env

    ports:
      - "8006:8006"

  cart-db:
    image: postgres:16
    container_name: cart-db
    restart: always

    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5437:5432"

    volumes:
      - cart_db_data:/var/lib/postgresql/data

    healthcheck:
