    volumes:
      - order_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  auth_db_data:
  product_db_data:
  location_db_data:
  warehouse_db_data:
  inventory_db_data:
  cart_db_data:
  order_db_data: