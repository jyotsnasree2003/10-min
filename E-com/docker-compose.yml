# ================= ORDER SERVICE =================

  order-service:
    build:
      context: ./order_service
      dockerfile: app/Dockerfile
    container_name: order-service
    depends_on:
      order-db:
        condition: service_healthy
    env_file:
      - ./order_service/.env

    ports:
      - "8007:8007"

  order-db:
    image: postgres:16
    container_name: order-db
    restart: always

    environment:
