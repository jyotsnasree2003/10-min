events {}

http {

    # =========================
    # Backend Services
    # =========================

    upstream auth_service {
        server auth-service:8000;
    }

    upstream product_service {
        server product-service:8002;
    }

    upstream location_service {
        server location-service:8003;
    }

    upstream warehouse_service {
        server warehouse-service:8004;
    }

    upstream inventory_service {
        server inventory-service:8005;
    }

    upstream cart_service {
        server cart-service:8006;
    }

    upstream order_service {
        server order-service:8007;
    }

    upstream notification_service {
        server notification-service:8008;
    }


    # =========================
    # API Gateway
    # =========================

    server {

        listen 80;

        # -------------------------
        # Auth Service
        # -------------------------
        location /api/auth/ {
            proxy_pass http://auth_service/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # -------------------------
        # Product Service
        # -------------------------
        location /api/products/ {
            proxy_pass http://product_service/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # -------------------------
        # Location Service
        # -------------------------
        location /api/location/ {
            proxy_pass http://location_service/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # -------------------------
        # Warehouse Service
        # -------------------------
        location /api/warehouses/ {
            proxy_pass http://warehouse_service/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # -------------------------
        # Inventory Service
        # -------------------------
        location /api/inventory/ {
            proxy_pass http://inventory_service/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # -------------------------
        # Cart Service
        # -------------------------
        location /api/cart/ {
            proxy_pass http://cart_service/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # -------------------------
        # Order Service
        # -------------------------
        location /api/orders/ {
            proxy_pass http://order_service/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # -------------------------
        # Notification Service
        # -------------------------
        location /api/notifications/ {
            proxy_pass http://notification_service/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}